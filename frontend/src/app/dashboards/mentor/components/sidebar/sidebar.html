<!--
  USE:
  Provides navigation specifically for the mentor dashboard.
-->

<aside class="sidebar">
  <nav class="sidebar-navigation">

    <!-- Dashboard -->
    <a
      routerLink="/mentor-dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-icon">⌂</span>
      <span>Dashboard</span>
    </a>

    <!-- Mentorship Requests -->
    <a routerLink="/mentor-requests" routerLinkActive="active">
      <span class="nav-icon">✉</span>
      <span>Requests</span>
    </a>

    <!-- Students -->
    <a routerLink="/mentor-students" routerLinkActive="active">
      <span class="nav-icon">◉</span>
      <span>Students</span>
    </a>

    <!-- Chat Inbox -->
    <a routerLink="/mentor-chat" routerLinkActive="active">
      <span class="nav-icon">💬</span>
      <span>Chat Inbox</span>
    </a>

    <!-- Sessions -->
    <a routerLink="/mentor-sessions" routerLinkActive="active">
      <span class="nav-icon">◷</span>
      <span>Sessions</span>
    </a>

    <!-- Resources -->
    <a routerLink="/mentor-resources" routerLinkActive="active">
      <span class="nav-icon">▣</span>
      <span>Resources</span>
    </a>

    <!-- Cheat Sheet -->
    <a routerLink="/mentor-cheatsheet" routerLinkActive="active">
      <span class="nav-icon">📚</span>
      <span>Cheat Sheet</span>
    </a>
  
<!-- Advanced Theory Dropdown -->
<div class="sidebar-dropdown">
  <button
    type="button"
    class="sidebar-dropdown-toggle"
    (click)="advancedTheoryOpen = !advancedTheoryOpen"
    [class.expanded]="advancedTheoryOpen"
    [attr.aria-expanded]="advancedTheoryOpen"
  >
    <span class="sidebar-menu-icon">✦</span>
    <span class="sidebar-menu-label">Advanced Theory Quiz</span>
    <span class="dropdown-chevron" [class.rotated]="advancedTheoryOpen">
      ▾
    </span>
  </button>

  <div class="sidebar-submenu" *ngIf="advancedTheoryOpen">
    <a
      routerLink="/mentor/advanced/theory-quizzes"
      routerLinkActive="active"
      class="sidebar-submenu-link"
    >
      <span class="submenu-dot"></span>
      My Theory Quizzes
    </a>

    <a
      routerLink="/mentor/advanced/theory-quizzes/csv-upload"
      routerLinkActive="active"
      class="sidebar-submenu-link"
    >
      <span class="submenu-dot"></span>
      Import Quiz CSV
    </a>
  </div>
</div>

<!-- Concept Comparison -->
<div class="sidebar-dropdown">
  <button
    type="button"
    class="concept-comparison-link dropdown-toggle"
    (click)="conceptComparisonOpen = !conceptComparisonOpen"
    [attr.aria-expanded]="conceptComparisonOpen"
  >
    <span class="nav-icon">⇄</span>
    <span>Concept Comparison</span>
    <span class="dropdown-arrow">
      {{ conceptComparisonOpen ? '▴' : '▾' }}
    </span>
  </button>

  @if (conceptComparisonOpen) {
    <div class="dropdown-menu">
      <a
        routerLink="/mentor/advanced/concept-comparison"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="dropdown-item"
      >
        <span class="nav-icon">＋</span>
        <span>Create Comparison</span>
      </a>

      <a
        routerLink="/mentor/advanced/my-comparisons"
        routerLinkActive="active"
        class="dropdown-item"
      >
        <span class="nav-icon">▤</span>
        <span>My Comparisons</span>
      </a>
    </div>
  }
</div>

    <!-- Profile -->
    <a routerLink="/mentor-profile" routerLinkActive="active">
      <span class="nav-icon">○</span>
      <span>Profile</span>
    </a>

  </nav>
</aside>

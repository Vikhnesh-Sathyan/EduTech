
<a
  class="skill-swap-card"
  routerLink="/skill-swap"
  aria-label="Open Skill Swap"
>
  <div class="card-top">
    <div class="icon-wrapper">
      <span class="swap-icon">⇄</span>
    </div>

    <span class="card-badge">
      <span class="status-dot"></span>
      Student community
    </span>
  </div>

  <div class="card-content">
    <p class="eyebrow">LEARN TOGETHER</p>

    <h3>Skill Swap</h3>

    <p class="description">
      Share what you know, discover new skills, and connect

  <div class="card-footer">
    <div class="feature-tags">
      <span>Teach</span>
      <span>Learn</span>
      <span>Connect</span>

    <div class="arrow-button" aria-hidden="true">
      <span>↗</span>

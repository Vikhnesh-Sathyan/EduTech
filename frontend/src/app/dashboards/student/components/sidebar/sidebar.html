<aside class="sidebar">

  <!-- Logo -->
  <div class="logo">
    EduTech
  </div>


  <!-- Main Navigation -->
  <nav class="navigation">

    <a
      routerLink="/student-dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="nav-label">
        Dashboard
      </span>
    </a>


    <a
      routerLink="/study"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Study
      </span>
    </a>


    <!-- Study Progress -->
    @if (currentStudy(); as study) {

  <div class="study-progress-widget">

  <div class="study-progress-header">
    <span class="study-progress-label">
      STUDY PROGRESS
    </span>
  </div>

  <div class="study-progress-main">

    <div>
      <div class="study-progress-subject">
        {{ study.subject_name }}
      </div>

      <div class="study-progress-summary">
        {{ study.completed_sections }}
        of
        {{ study.total_sections }}
        sections completed
      </div>
    </div>

    <div class="study-progress-percentage">
      {{ study.progress_percentage }}%
    </div>

  </div>

  <a
    routerLink="/study-progress"
    class="study-progress-link"
  >
    <span>View All</span>
    <span>→</span>
  </a>

</div>

    }


    <a
      routerLink="/project-understanding"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Projects
      </span>
    </a>


    <a
      routerLink="/practice"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Practice
      </span>
    </a>


    <a
      routerLink="/career"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Career
      </span>
    </a>


    <!-- Mentor Discovery -->
    <a
      routerLink="/mentors"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Mentors
      </span>
    </a>


    <!-- Current Mentor -->
    <a
      routerLink="/student-my-mentor"
      routerLinkActive="active"
    >
      <span class="nav-label">
        My Mentor
      </span>
    </a>


    <a
      routerLink="/profile"
      routerLinkActive="active"
    >
      <span class="nav-label">
        Profile
      </span>
    </a>

  </nav>


  <!-- Logout -->
  <div class="logout-section">

    <button
      type="button"
      (click)="logout()"
    >
      Logout
    </button>

  </div>

</aside>


<section class="cheatsheet-admin-page">

  <!-- Page Header -->
  <header class="page-header">
    <div>
      <h1>Developer Cheat Sheet</h1>
      <p>Manage technologies, categories, and developer reference content.</p>
    </div>
  </header>

  <!-- CSV Import -->
  <section class="import-section">
    <div>
      <h2>Import Technologies</h2>
      <p>Import technology records from your CSV file.</p>
    </div>

    <button
      type="button"
      (click)="importTechnologies()"
      [disabled]="importing()">
      {{ importing() ? 'Importing...' : 'Import CSV' }}
    </button>
  </section>

  <!-- Import Messages -->
  <p class="success-message" *ngIf="message()">
    {{ message() }}
  </p>

  <p class="error-message" *ngIf="error()">
    {{ error() }}
  </p>

  <!-- Management Tabs -->
  <nav class="management-tabs" aria-label="Cheat sheet management">
    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab() === 'technologies'"
      [attr.aria-selected]="activeTab() === 'technologies'"
      (click)="setActiveTab('technologies')">
      Technologies
    </button>

    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab() === 'categories'"
      [attr.aria-selected]="activeTab() === 'categories'"
      (click)="setActiveTab('categories')">
      Categories
    </button>

    <button
      type="button"
      class="tab-button"
      [class.active]="activeTab() === 'topics'"
      [attr.aria-selected]="activeTab() === 'topics'"
      (click)="setActiveTab('topics')">
      Topics
    </button>
  </nav>



  <!-- Technologies Tab -->
  <section
    class="management-section"
    *ngIf="activeTab() === 'technologies'">
    <app-technology-management></app-technology-management>
  </section>

  <!-- Categories Tab -->
  <section
    class="management-section"
    *ngIf="activeTab() === 'categories'">
    <app-category-management></app-category-management>
  </section>
<!-- Topics Tab -->
  <section
  class="management-section"
  *ngIf="activeTab() === 'topics'">
  <app-topic-management></app-topic-management>
</section>
</section>


<div class="sql-workspace">

  <!-- EDITOR HEADER -->
  <div class="workspace-header">
    <div>
      <span class="workspace-label">PRACTICE WORKSPACE</span>
      <h2>Write Your SQL Query</h2>
      <p>Write your solution using the database schema provided.</p>
    </div>

    <span class="language-badge">MYSQL</span>
  </div>

  <!-- SQL EDITOR -->
  <div class="editor-container">

    <div class="editor-toolbar">
      <span>SQL Editor</span>
      <span>MySQL</span>
    </div>

    <div class="editor-body">

      <div class="line-numbers">
        <span>1</span>
      </div>

      <textarea
        spellcheck="false"
        placeholder="-- Write your SQL query here..."
        [value]="sqlQuery()"
        (input)="onQueryChange($any($event.target).value)"
      ></textarea>

    </div>

  </div>

  <!-- EDITOR FOOTER -->
  <div class="editor-footer">
    <span>Write your query carefully before submitting.</span>
    <span>{{ sqlQuery().length }} characters</span>
  </div>

<!-- QUERY READY STATUS -->
<div class="submit-section">
  <span class="query-ready">
    <i class="fas fa-check-circle"></i>
    Your query will be included when you submit the challenge.
  </span>
</div>

</div>

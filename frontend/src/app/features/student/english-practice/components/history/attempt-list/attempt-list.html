
<section class="attempt-list">

  @for (attempt of attempts(); track attempt.id) {

    <app-attempt-card
      [attempt]="attempt"
    />

  } @empty {

    <div class="empty-state">
      <h3>No speaking attempts yet</h3>
      <p>Your speaking practice history will appear here.</p>
    </div>

  }

</section>


<section class="debate-entry">

  <div class="debate-content">

    <div class="debate-icon">
      <span>⚖</span>
    </div>

    <div class="debate-text">
      <span class="section-label">AI POWERED PRACTICE</span>

      <h2>Debate Practice</h2>

      <p>
        Improve your English communication, critical thinking,
        vocabulary and argument-building skills through interactive
        AI-powered debates.
      </p>

      <div class="debate-features">
        <span>AI Opponent</span>
        <span>Real-time Discussion</span>
        <span>Performance Evaluation</span>
      </div>
    </div>

  </div>

  <div class="debate-actions">

    <button
      class="start-button"
      (click)="startDebate()"
    >
      Start Debate
      <span>→</span>
    </button>

    <button
      class="history-button"
      (click)="viewHistory()"
    >
      View History
    </button>

  </div>

</section>

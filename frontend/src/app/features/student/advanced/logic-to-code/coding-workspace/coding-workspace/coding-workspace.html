
<div class="workspace-page">

  <!-- LOADING -->
  <div class="state-card" *ngIf="loading()">

    <div class="loader"></div>

    <p>Preparing your coding workspace...</p>

  </div>

  <!-- ERROR -->
  <div
    class="state-card error-state"
    *ngIf="!loading() && errorMessage()">

    <h2>Unable to load workspace</h2>

    <p>{{ errorMessage() }}</p>

  </div>

  <!-- WORKSPACE -->
  <ng-container *ngIf="!loading() && problemDetails() as details">

    <!-- HEADER -->
    <header class="workspace-header">

      <div class="header-content">

        <span class="eyebrow">STUDENT WORKSPACE</span>

        <h1>{{ details.problem.title }}</h1>

        <div class="problem-meta">

          <span
            class="difficulty"
            [ngClass]="details.problem.difficulty.toLowerCase()">

            {{ details.problem.difficulty }}

          </span>

          <span>
            Mentor: {{ details.problem.mentor_name }}
          </span>

          <span>
            Subject: {{ details.problem.subject_name }}
          </span>

        </div>

      </div>

    </header>

    <!-- TWO PANEL WORKSPACE -->
    <div class="workspace-layout">

      <!-- LEFT: LEARNING PANEL -->
      <app-learning-panel
        [problem]="details.problem"
        [steps]="details.steps"
        [hints]="details.hints"
        [mistakes]="details.mistakes"
        [referenceSolution]="details.referenceSolution"
        [publicTestCases]="details.publicTestCases">
      </app-learning-panel>

      <!-- RIGHT: CODING WORKSPACE -->
      <main class="coding-panel">

        <!-- CODE EDITOR -->
        <app-code-editor
          [selectedLanguage]="selectedLanguage()"
          [languageLabel]="details.problem.language_label"
          [sourceCode]="sourceCode()"
          [submitting]="submitting()"
          (sourceCodeChange)="sourceCode.set($event)"
          (runRequested)="submitAndRun()">
        </app-code-editor>

        <!-- EXECUTION RESULTS -->
        <app-execution-results
          [executionError]="executionError()"
          [executionResult]="executionResult()">
        </app-execution-results>

      </main>

    </div>

  </ng-container>

</div>

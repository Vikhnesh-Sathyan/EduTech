
<div class="report-form">

  <div class="report-header">
    <div>
      <h3>Report Discussion</h3>
      <p>Tell us why this discussion should be reviewed.</p>
    </div>

    <button
      type="button"
      class="close-button"
      (click)="closeReport()"
      [disabled]="submitting()">
      ✕
    </button>
  </div>

  <div class="form-group">
    <label for="reportReason">Reason for reporting</label>

    <select
      id="reportReason"
      [ngModel]="reason()"
      (ngModelChange)="reason.set($event)">

      <option value="">Select a reason</option>
      <option value="spam">Spam</option>
      <option value="harassment">Harassment</option>
      <option value="inappropriate">Inappropriate Content</option>
      <option value="misinformation">Misinformation</option>
      <option value="other">Other</option>

    </select>
  </div>

  <div class="form-group">
    <label for="reportDescription">
      Additional details
      <span>(Optional)</span>
    </label>

    <textarea
      id="reportDescription"
      rows="4"
      maxlength="2000"
      placeholder="Explain why you are reporting this discussion..."
      [ngModel]="description()"
      (ngModelChange)="description.set($event)">
    </textarea>

    <small>{{ description().length }}/2000 characters</small>
  </div>

  <div class="report-actions">
    <button
      type="button"
      class="cancel-button"
      (click)="closeReport()"
      [disabled]="submitting()">
      Cancel
    </button>

    <button
      type="button"
      class="submit-button"
      (click)="submitReport()"
      [disabled]="submitting()">

      {{ submitting() ? 'Submitting...' : 'Submit Report' }}

    </button>
  </div>

</div>

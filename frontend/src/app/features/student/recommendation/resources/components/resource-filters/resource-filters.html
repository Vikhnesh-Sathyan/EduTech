<section class="resource-filters">

  <div class="filter-header">
    <div>
      <h2>Explore Resources</h2>
      <p>Find learning materials for your subjects.</p>
    </div>
  </div>

  <div class="filter-controls">

    <!-- Subject filter -->
    <div class="filter-group">
      <label for="subjectFilter">Subject</label>

      <select
        id="subjectFilter"
        [value]="selectedSubjectId() ?? ''"
        (change)="onSubjectSelect($any($event.target).value)"
      >
        <option value="">All subjects</option>

        <option
          *ngFor="let subject of subjects()"
          [value]="subject.id"
        >
          {{ subject.name }}
        </option>
      </select>
    </div>

    <!-- Resource type filter -->
    <div class="filter-group">
      <label for="resourceTypeFilter">Resource type</label>

      <select
        id="resourceTypeFilter"
        [value]="selectedResourceType()"
        (change)="onResourceTypeSelect($any($event.target).value)"
      >
        <option
          *ngFor="let type of resourceTypes"
          [value]="type.value"
        >
          {{ type.label }}
        </option>
      </select>
    </div>

  </div>

</section>

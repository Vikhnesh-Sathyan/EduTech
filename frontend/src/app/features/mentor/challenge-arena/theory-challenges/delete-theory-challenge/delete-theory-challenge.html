<app-confirm-modal
  [visible]="visible()"
  title="Delete Theory Challenge"
  message="Are you sure you want to delete this theory challenge? This action cannot be undone."
  confirmText="Delete Challenge"
  cancelText="Cancel"
  [danger]="true"
  (confirmed)="deleteChallenge()"
  (cancelled)="closeDeleteModal()"
>
</app-confirm-modal>
